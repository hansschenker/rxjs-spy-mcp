<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rxjs-spy harness</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 48rem;
        padding: 0 1rem;
      }
      button {
        font-size: 1rem;
        margin: 0 0.5rem 0.5rem 0;
        padding: 0.5rem 1rem;
      }
      code {
        background: #f0f0f0;
        border-radius: 3px;
        padding: 0.1rem 0.3rem;
      }
      pre {
        background: #1e1e1e;
        border-radius: 6px;
        color: #d4d4d4;
        max-height: 24rem;
        overflow: auto;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>rxjs-spy harness</h1>
    <p>
      The spy is active and its MCP surface is installed as
      <code>__RXJS_SPY__</code>. Drive it with Chrome DevTools MCP evaluate
      tooling — start with <code>__RXJS_SPY__.help()</code>, then
      <code>status()</code>, <code>snapshot({ match: "clock" })</code>, or
      <code>log("search")</code> + <code>logs({ sinceIndex: 0 })</code>.
    </p>
    <div>
      <button id="clock">Start clock (tag "clock")</button>
      <button id="search">Simulate live search (tags "search*")</button>
      <button id="failing">Start failing stream (tag "failing")</button>
    </div>
    <pre id="output"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
